# ── Pourquoi Gradle lit un magasin de confiance à part (02/08/2026) ──────────
#
# Le trafic sortant est **intercepté** sur ce poste : Windows connaît l'autorité
# qui le signe, le JDK non. Sans les options ci-dessous, l'ajout
# d'`integration_test` fait échouer la compilation sur `PKIX path building
# failed` en récupérant `com.android.tools.build:gradle:8.2.1` — sur cinq dépôts
# à la suite, dl.google.com compris.
#
# ⚠️ **Le diagnostic évident était faux, deux fois.** Ce n'était ni une panne
# réseau ni un artefact manquant : le `.pom`, le `.jar` et le `.module` de cette
# version **étaient déjà dans le cache Gradle**, complets, et la même URL
# répondait **200 depuis PowerShell**. Et `trustStoreType=Windows-ROOT`, qui
# aurait résolu le problème d'une ligne, échoue ici sur « Windows-ROOT not
# found » : **le JetBrains Runtime livré avec Android Studio — celui que Flutter
# emploie par défaut — n'embarque pas SunMSCAPI** et ne sait donc pas ouvrir le
# magasin Windows. Vérifié : le keytool de Temurin l'ouvre (60 entrées), celui
# du JBR refuse. D'où un fichier PKCS12 dérivé une fois pour toutes.
#
# Pourquoi le défaut n'est apparu que maintenant : la compilation de
# l'application n'avait plus rien à résoudre. `integration_test` est un
# sous-projet neuf qui déclare ses propres dépôts — donc une résolution neuve,
# donc un aller sur le réseau.
#
# ── Le régénérer (le fichier est gitignoré, et doit l'être) ──────────────────
#
#   & "$env:JAVA_HOME\bin\keytool.exe" -importkeystore `
#       -srcstoretype Windows-ROOT -srckeystore NONE `
#       -destkeystore android/windows-root.p12 -deststoretype PKCS12 `
#       -deststorepass changeit -noprompt
#
# ⚠️ Avec un JDK qui **a** SunMSCAPI (Temurin, Oracle) — pas le JBR d'Android
# Studio, qui ne sait pas lire la source. Le fichier contient les autorités
# auxquelles CE poste fait confiance : il ne voyage pas avec le dépôt.
#
# ⚠️ Chemin **relatif au projet Android**, pas absolu : un chemin absolu
# committé casse chez tout le monde sauf son auteur. Sur un poste sans
# interception, le fichier est simplement absent et ces options sont à retirer —
# rien d'autre n'en dépend.
#
# ⚠️ **Réserve à connaître** : la forme **absolue** est celle qui a été prouvée
# sur une résolution réellement partie sur le réseau. La forme relative a passé
# une exécution complète, mais **après** que le cache Gradle eut été rempli —
# elle n'a donc pas été éprouvée à froid, et Java résout ce chemin depuis le
# répertoire courant de la JVM, qui n'est pas garanti être celui du projet. Si
# `PKIX path building failed` réapparaît sur une machine propre, repasser en
# absolu est le premier essai à faire.
org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError -Djavax.net.ssl.trustStoreType=PKCS12 -Djavax.net.ssl.trustStore=windows-root.p12 -Djavax.net.ssl.trustStorePassword=changeit
android.useAndroidX=true
android.enableJetifier=true
