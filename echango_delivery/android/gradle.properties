# ── Pourquoi Gradle lit un magasin de confiance à part (02/08, revu 05/09/2026) ──
#
# Le trafic sortant est **intercepté** sur ce poste : Windows connaît l'autorité
# qui le signe, le JDK non. Sans l'option ci-dessous, une résolution qui part
# réellement sur le réseau (un sous-projet neuf comme `integration_test`, ou une
# version de dépendance pas encore en cache) échoue sur `PKIX path building
# failed`, dl.google.com et repo.maven.apache.org compris.
#
# ⚠️ **`trustStoreType=Windows-ROOT` avait été écarté à tort le 02/08/2026**, sur
# un « Windows-ROOT not found » attribué au JetBrains Runtime d'Android Studio
# (pas de `SunMSCAPI`, donc pas d'accès au magasin Windows) — d'où un détour par
# un fichier PKCS12 dérivé du magasin Windows une fois pour toutes. Revérifié le
# 05/09/2026 : le JDK que **Flutter** utilise réellement pour Gradle (`flutter
# doctor -v` → « Java binary at ») est le Temurin configuré par `flutter config
# --jdk-dir`, pas le JBR — et Temurin **a** `SunMSCAPI`. `Windows-ROOT` marche
# donc directement, sans fichier à dériver ni à tenir à jour : le magasin
# Windows est lu en direct, jamais périmé.
#
# ⚠️ **Si `PKIX path building failed` réapparaît malgré cette ligne** — poste où
# Flutter a été reconfiguré sur le JBR, par exemple — le recours est le fichier
# PKCS12 dérivé, qui a servi précédemment :
#
#   & "$env:JAVA_HOME\bin\keytool.exe" -importkeystore `
#       -srcstoretype Windows-ROOT -srckeystore NONE `
#       -destkeystore android/windows-root.p12 -deststoretype PKCS12 `
#       -deststorepass changeit -noprompt
#
# avec `$JAVA_HOME` pointé sur un JDK qui a `SunMSCAPI` (Temurin, Oracle — pas
# le JBR, qui ne sait pas lire la source), puis remplacer la ligne ci-dessous par
# `-Djavax.net.ssl.trustStoreType=PKCS12 -Djavax.net.ssl.trustStore=<chemin
# ABSOLU>/android/windows-root.p12 -Djavax.net.ssl.trustStorePassword=changeit`
# — chemin absolu, pas relatif : Java le résout depuis le répertoire courant de
# la JVM, pas garanti être celui du projet, et un relatif n'a été éprouvé
# qu'après que le cache Gradle était déjà rempli, donc pas à froid. Le fichier
# est gitignoré et propre à CE poste ; il ne voyage pas avec le dépôt.
#
# Sur un poste sans interception, cette option est un no-op inoffensif — pas
# besoin de la retirer.
org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError -Djavax.net.ssl.trustStoreType=Windows-ROOT
android.useAndroidX=true
android.enableJetifier=true
