name: echango_delivery
description: Echango Delivery — application unique servant les profils transporteur, commerçant et gestionnaire de flotte.
publish_to: none

version: 0.1.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: '>=3.20.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Navigation
  go_router: ^14.6.0

  # State Management
  provider: ^6.1.2

  # Networking
  http: ^1.2.2

  # Storage & Security
  shared_preferences: ^2.3.3
  flutter_secure_storage: ^9.2.2
  sqflite: ^2.3.0

  # Location & Geolocation
  geolocator: ^13.0.1
  flutter_foreground_task: ^7.0.0

  # Push Notifications
  firebase_core: ^2.24.0
  firebase_messaging: ^14.6.0

  # Permissions
  permission_handler: ^11.3.1

  # UI
  cupertino_icons: ^1.0.8

  # Utilities
  equatable: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mockito: ^5.6.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/translations/
