name: echango_delivery
description: Echango Delivery — application unique servant les profils transporteur, commerçant et gestionnaire de flotte.
publish_to: none

version: 0.1.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'
  # ⚠️ Cette borne est **déduite de la ligne du dessus, pas choisie** : Dart 3.5
  # est livré par Flutter 3.24, donc tout SDK qui satisfait `sdk: >=3.5.0` est
  # déjà un Flutter >= 3.24. Une borne plus basse ne relâche donc rien — elle
  # décrit un socle que `pub` refuserait de toute façon.
  #
  # Elle a déclaré `>=3.20.0` jusqu'au 01/08/2026, et cette valeur était fausse
  # deux fois : Flutter 3.20 n'a **jamais existé en stable** (le canal passe de
  # 3.19 à 3.22, 3.20 n'ayant vécu qu'en beta), et elle contredisait la
  # contrainte Dart de la ligne au-dessus. Le coût n'était pas théorique : cinq
  # passages du dépôt s'en servaient pour écarter une API — dont trois visant
  # `surfaceContainerHighest`, disponible depuis le début. Il était même employé
  # à deux endroits et refusé à un troisième, ce qui a été consigné comme une
  # contradiction du code alors que c'était la borne qui mentait.
  #
  # ⚠️ Ne pas la baisser sans refaire les deux calculs : la contrainte que `pub`
  # applique est celle de la ligne `sdk:`, et une borne `flutter:` plus permissive
  # qu'elle est au mieux inutile, au pire un argument faux que quelqu'un citera.
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Navigation
  go_router: ^14.6.0

  # State Management
  provider: ^6.1.2

  # Networking
  http: ^1.2.2

  # Storage & Security
  shared_preferences: ^2.3.3
  flutter_secure_storage: ^9.2.2
  sqflite: ^2.3.0

  # Location & Geolocation
  geolocator: ^13.0.1
  flutter_foreground_task: ^7.0.0

  # Push Notifications
  firebase_core: ^2.24.0
  firebase_messaging: ^14.6.0

  # Permissions
  permission_handler: ^11.3.1

  # Capture photo (preuve de livraison, signalement d'échec)
  image_picker: ^1.1.2

  # Ouverture d'une application de navigation externe
  url_launcher: ^6.3.1

  # Partage natif du lien de localisation (§1.2 de
  # docs/specs_localisation_client_et_optimisation_parcours.md) — la
  # plateforme n'envoie rien elle-même, le commerçant partage lui-même via
  # SMS/WhatsApp/etc. avec le mécanisme de partage déjà présent sur son
  # téléphone.
  share_plus: ^10.1.2

  # Carte — OpenStreetMap plutôt que Google Maps : pas de clé API, pas de
  # facturation au chargement, cohérent avec le choix d'auto-héberger le reste.
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # UI
  cupertino_icons: ^1.0.8

  # Utilities
  equatable: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # Pilotage de l'application sur un vrai appareil (02/08/2026).
  #
  # `flutter_test` monte des widgets dans un moteur sans plateforme ; il ne peut
  # donc rien dire du démarrage réel, du stockage sécurisé, ni du réseau. Ce
  # paquet lance `main()` sur un émulateur et tape dans l'écran — c'est le seul
  # moyen de croiser l'application et le BFF, que les sept scénarios de
  # `scripts/` exercent aujourd'hui **sans jamais passer par l'app**.
  #
  # Vient du SDK, donc aucune version à épingler ni à faire vieillir.
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/translations/

  # ── Les polices du système de design, EMBARQUÉES ──────────────────────────
  #
  # Cairo pour les titres, IBM Plex Sans Arabic pour le corps : deux familles
  # retenues parce qu'elles **dessinent l'arabe**, pas parce qu'elles sont jolies
  # en latin (voir `lib/theme/app_theme.dart`).
  #
  # ⚠️ Embarquées et non chargées par `google_fonts`, contrairement à Echango
  # Promo dont ce lot reprend le système : le paquet télécharge les polices au
  # premier usage, donc un premier lancement sans réseau retombe **en silence**
  # sur la police système. Nos transporteurs ouvrent l'application sur le
  # terrain — l'identité y disparaîtrait précisément là où l'application sert.
  # ~970 ko dans l'APK, licences OFL comprises, contre une dépendance de plus et
  # un repli invisible.
  #
  # ⚠️ Cairo n'existe en amont qu'en police **variable** : les trois graisses ont
  # été instanciées (`fontTools.varLib.instancer`, wght=400|600|700, slnt=0)
  # plutôt qu'employées via `fontVariations`, pour que `fontWeight` se comporte
  # normalement. Les fichiers sont nommés par leur graisse, et non par un nom
  # commercial (« SemiBold »), pour que le lien avec le `weight:` d'à côté soit
  # lisible sans connaître la convention.
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-400.ttf
          weight: 400
        - asset: assets/fonts/Cairo-600.ttf
          weight: 600
        - asset: assets/fonts/Cairo-700.ttf
          weight: 700
    - family: IBMPlexSansArabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSansArabic-Medium.ttf
          weight: 500
