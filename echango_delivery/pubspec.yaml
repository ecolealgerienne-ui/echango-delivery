name: echango_delivery
description: Echango Delivery — application unique servant les profils transporteur, commerçant et gestionnaire de flotte.
publish_to: none

version: 0.1.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'
  # ⚠️ Cette borne est **déduite de la ligne du dessus, pas choisie** : Dart 3.5
  # est livré par Flutter 3.24, donc tout SDK qui satisfait `sdk: >=3.5.0` est
  # déjà un Flutter >= 3.24. Une borne plus basse ne relâche donc rien — elle
  # décrit un socle que `pub` refuserait de toute façon.
  #
  # Elle a déclaré `>=3.20.0` jusqu'au 01/08/2026, et cette valeur était fausse
  # deux fois : Flutter 3.20 n'a **jamais existé en stable** (le canal passe de
  # 3.19 à 3.22, 3.20 n'ayant vécu qu'en beta), et elle contredisait la
  # contrainte Dart de la ligne au-dessus. Le coût n'était pas théorique : cinq
  # passages du dépôt s'en servaient pour écarter une API — dont trois visant
  # `surfaceContainerHighest`, disponible depuis le début. Il était même employé
  # à deux endroits et refusé à un troisième, ce qui a été consigné comme une
  # contradiction du code alors que c'était la borne qui mentait.
  #
  # ⚠️ Ne pas la baisser sans refaire les deux calculs : la contrainte que `pub`
  # applique est celle de la ligne `sdk:`, et une borne `flutter:` plus permissive
  # qu'elle est au mieux inutile, au pire un argument faux que quelqu'un citera.
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Navigation
  go_router: ^14.6.0

  # State Management
  provider: ^6.1.2

  # Networking
  http: ^1.2.2

  # Storage & Security
  shared_preferences: ^2.3.3
  flutter_secure_storage: ^9.2.2
  sqflite: ^2.3.0

  # Location & Geolocation
  geolocator: ^13.0.1
  flutter_foreground_task: ^7.0.0

  # Push Notifications
  firebase_core: ^2.24.0
  firebase_messaging: ^14.6.0

  # Permissions
  permission_handler: ^11.3.1

  # Capture photo (preuve de livraison, signalement d'échec)
  image_picker: ^1.1.2

  # Ouverture d'une application de navigation externe
  url_launcher: ^6.3.1

  # Carte — OpenStreetMap plutôt que Google Maps : pas de clé API, pas de
  # facturation au chargement, cohérent avec le choix d'auto-héberger le reste.
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # UI
  cupertino_icons: ^1.0.8

  # Utilities
  equatable: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/translations/
