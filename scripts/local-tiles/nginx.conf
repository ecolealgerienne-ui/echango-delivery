# Cache-proxy des tuiles OpenStreetMap — DÉVELOPPEMENT UNIQUEMENT.
#
# Pourquoi : les émulateurs Android de ce poste ne résolvent pas le DNS de
# manière fiable (net.dns1 vide, latence ~500 ms intermittente vers le CDN
# Fastly). `AppConsultationMap` demandait alors des dizaines de tuiles à
# `tile.openstreetmap.org` qui n'aboutissaient jamais — carte vide.
#
# Ce proxy tourne dans un conteneur (DNS Docker fonctionnel), va chercher les
# tuiles en amont, les met en cache, et les sert sur une IP brute que
# l'émulateur atteint sans DNS : `http://10.0.2.2:8082/{z}/{x}/{y}.png`.
#
# Le cache respecte aussi la politique d'usage d'OSM : une tuile déjà vue
# n'est pas redemandée pendant 30 jours.

worker_processes 1;
events { worker_connections 256; }

http {
  access_log off;

  proxy_cache_path /var/cache/nginx/osm
    levels=1:2 keys_zone=osm:20m max_size=2g inactive=30d use_temp_path=off;

  # nginx résout lui-même l'amont (le `proxy_pass` variabilisé l'y oblige) —
  # c'est ce qui contourne la résolution cassée de l'hôte.
  resolver 8.8.8.8 1.1.1.1 valid=300s ipv6=off;
  resolver_timeout 5s;

  server {
    listen 80;

    # Santé : `curl -f http://localhost:8082/healthz`
    location = /healthz {
      return 200 "ok\n";
      add_header Content-Type text/plain;
    }

    location / {
      set $osm "tile.openstreetmap.org";
      proxy_pass https://$osm$request_uri;
      proxy_ssl_server_name on;
      proxy_set_header Host tile.openstreetmap.org;
      # OSM exige un User-Agent identifiant (sa politique d'usage).
      proxy_set_header User-Agent "echango-delivery-dev-tilecache";
      proxy_set_header Accept-Encoding "";

      proxy_cache osm;
      proxy_cache_key "$request_uri";
      proxy_cache_valid 200 302 30d;
      proxy_cache_valid 404 1h;
      proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
      proxy_cache_lock on;
      add_header X-Tile-Cache $upstream_cache_status;

      expires 30d;
    }
  }
}
